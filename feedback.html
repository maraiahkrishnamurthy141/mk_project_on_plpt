<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Collection & Analysis</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #2b5876, #4e4376, #6dd5ed, #2193b0);
            background-size: 400% 400%;
            animation: gradient 12s ease infinite;
            color: white;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 750px;
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.15);
            padding: 35px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 10px;
        }

        label {
            font-size: 18px;
            font-weight: 500;
        }

        select, input[type=text], textarea {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            margin-bottom: 22px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        textarea {
            height: 120px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: #ffeb3b;
            color: black;
            font-size: 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #fdd835;
            transform: scale(1.05);
        }

    </style>

</head>
<body>

    <div class="container">
        <h1>Feedback Collection & Analysis</h1>

        <!-- Flask Form -->
        <form method="POST">

            <label>Your Name</label>
            <input type="text" name="name" required placeholder="Enter your name">

            <label>Department</label>
            <select name="department" required>
                <option value="">Select Department</option>
                <option>Computer Engineering</option>
                <option>Mechanical Engineering</option>
                <option>Civil Engineering</option>
                <option>ECE</option>
                <option>EEE</option>
            </select>

            <label>Feedback Category</label>
            <select name="category" required>
                <option>Teaching Quality</option>
                <option>Lab Facilities</option>
                <option>Infrastructure</option>
                <option>Library</option>
                <option>Hostel</option>
                <option>Placement Training</option>
            </select>

            <label>Rate Your Experience</label>
            <select name="rating" required>
                <option>Excellent</option>
                <option>Good</option>
                <option>Average</option>
                <option>Poor</option>
            </select>

            <label>Your Suggestions</label>
            <textarea name="suggestion" required placeholder="Write your suggestions here..."></textarea>

            <button class="btn-submit">Submit Feedback</button>
        </form>

        <br>
        <a href="{{ url_for('home') }}" style="color:white; text-decoration:underline;">← Back to Home</a>

    </div>

</body>
</html>
